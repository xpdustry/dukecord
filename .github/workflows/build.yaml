name: "Build"

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Create a release (tag, publish, draft github release, then bump)"
        required: true
        default: false
        type: boolean
  push:
    branches: [ "**" ]
    tags-ignore: [ "**" ]
  pull_request:

concurrency:
  group: "${{ github.workflow }}-${{ github.event.number || github.ref }}"
  cancel-in-progress: true

env:
  ORG_GRADLE_PROJECT_is_release: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}

jobs:
  action:
    name: "Action"
    # Only run on PRs if the source branch is on someone else's repo
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
      checks: write
    steps:

      - name: "Checkout Repository"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: "Setup Java 25"
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: "Get And Validate Version"
        id: version
        run: |
          version="$(cat VERSION.txt | xargs)"
          .github/scripts/version-validate.sh "$version" "$ORG_GRADLE_PROJECT_is_release"
          echo "version=${version%-SNAPSHOT}" >> "$GITHUB_OUTPUT"

      - name: "Build Gradle"
        run: ./gradlew build

      - name: "Upload Jar"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artifacts
          path: "build/libs/dukecord.jar"
          if-no-files-found: error

      - name: "Upload Test Results"
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: |
            build/test-results/test/TEST-*.xml
            build/reports/

      - name: "Create Release Tag"
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      # - name: "Publish to Maven"
      #   if: ${{ (github.event_name == 'workflow_dispatch' && inputs.release) || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/dev') }}
      #   run: ./gradlew publish
      #   env:
      #     ORG_GRADLE_PROJECT_xpdustryUsername: "${{ secrets.XPDUSTRY_MAVEN_USERNAME }}"
      #     ORG_GRADLE_PROJECT_xpdustryPassword: "${{ secrets.XPDUSTRY_MAVEN_PASSWORD }}"
      #     ORG_GRADLE_PROJECT_signingKey: "${{ secrets.XPDUSTRY_MAVEN_SIGNING_KEY }}"
      #     ORG_GRADLE_PROJECT_signingPassword: "${{ secrets.XPDUSTRY_MAVEN_SIGNING_PASSWORD }}"

      - name: "Create Draft Release"
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "v${{ steps.version.outputs.version }}"

      - name: "Bump Version"
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        run: .github/scripts/version-bump.sh "VERSION.txt" "${{ steps.version.outputs.version }}"

      - name: "Commit Version Bump"
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        uses: stefanzweifel/git-auto-commit-action@778341af668090896ca464160c2def5d1d1a3eb0 # v6
        with:
          commit_message: "chore(release): Bump VERSION.txt"
          file_pattern: "VERSION.txt"

  event-file:
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    name: "Event File"
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:

      - name: "Upload Event File"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: event-file
          path: ${{ github.event_path }}
